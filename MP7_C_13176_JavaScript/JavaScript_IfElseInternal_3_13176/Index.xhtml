<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <title>If-Else Internal: Wahana Taman Hiburan</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <script type="text/javascript">
        var iTinggi;
        var sDamping;

        iTinggi = prompt("Masukkan tinggi badan (cm).", 0);
        sDamping = prompt("Didampingi orang dewasa? (Y)a atau (T)idak", "Y");

        if(iTinggi > 140){
            if(sDamping == "Y"){
                alert("Boleh naik wahana ekstrim");
            } else {
                alert("Boleh naik, disarankan didampingi");
            }
        } else {
            if(sDamping == "Y"){
                alert("Hanya wahana anak (didampingi)");
            } else {
                alert("Tidak boleh naik wahana");
            }
        }
    </script>
</head>

<body>
    <h1>If-Else Internal: Wahana Taman Hiburan</h1>
    <p>Reload halaman untuk mencoba lagi.</p>
</body>

</html>
